name: Release

on:
  push:
    tags: ['v*']
  schedule:
    # Nightly, 07:00 UTC. Builds main and republishes the `latest` prerelease.
    # Skipped when main has not moved since the last one — see the version job.
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The single source of the two version strings, so the eight build jobs below
  # cannot drift and the tag/non-tag split is decided in exactly one place.
  #
  # `protocol` is the wire protocol number. The lobby compares it against every
  # connecting client (services/lobby/client.go:157), so a nightly must NEVER
  # invent a new one: the moment the lobby redeployed at it, every stable client
  # would be rejected. A nightly therefore reuses the checked-in number.
  #
  # `build_id` is the build's own identity, and the only thing self-update
  # compares. On a tag the two are equal.
  version:
    runs-on: ubuntu-latest
    outputs:
      protocol: ${{ steps.v.outputs.protocol }}
      build_id: ${{ steps.v.outputs.build_id }}
      channel: ${{ steps.v.outputs.channel }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve versions
        id: v
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            protocol="${GITHUB_REF_NAME#v}"
            build_id="$protocol"
            channel=stable
            skip=false
          else
            # Read the protocol number from the tree rather than the ref. A
            # branch ref is not a version: the old `${GITHUB_REF_NAME#v}` here
            # yielded the literal string "main", which the Windows VERSIONINFO
            # quad cannot represent and CFBundleShortVersionString rejects.
            protocol="$(sed -n 's/^set(SILENCER_VERSION "\([0-9]\{1,\}\)".*/\1/p' \
                        clients/silencer/CMakeLists.txt | head -1)"
            if [[ -z "$protocol" ]]; then
              echo "could not read SILENCER_VERSION from clients/silencer/CMakeLists.txt" >&2
              exit 1
            fi
            build_id="${protocol}+nightly.$(date -u +%Y%m%d).${GITHUB_SHA::7}"
            channel=nightly
            skip=false
            # A scheduled run with nothing new to ship is wasted three-platform
            # build time and a wasted notarization round-trip. Manual dispatch
            # always builds, so there is a way to force one.
            if [[ "${GITHUB_EVENT_NAME}" == schedule ]]; then
              last="$(git rev-list -n1 --before='24 hours ago' HEAD || true)"
              if [[ -n "$last" && "$last" == "$(git rev-parse HEAD)" ]]; then
                echo "main has not moved in 24h; skipping nightly"
                skip=true
              fi
            fi
          fi
          echo "protocol=$protocol" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "protocol=$protocol build_id=$build_id channel=$channel skip=$skip"

  build-macos:
    # Pinned to macos-15 (arm64): macos-latest migrated to macOS 26 (2026-06-15),
    # whose stricter dyld (duplicate LC_RPATH abort) + local-network/loopback
    # behavior break the release bundle + auto-updater e2e. macos-15 is where the
    # e2e passed for every prior release. Revisit once the e2e is macOS-26-ready
    # (issue #321).
    runs-on: macos-15
    timeout-minutes: 45
    needs: version
    if: needs.version.outputs.skip != 'true'
    env:
      SCCACHE_GHA_ENABLED: "true"
      SILENCER_VERSION: ${{ needs.version.outputs.protocol }}
      SILENCER_BUILD_ID: ${{ needs.version.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Install create-dmg
        # Release-only; the shared composite installs minizip + dylibbundler.
        run: brew install create-dmg

      - name: Build silencer
        uses: ./.github/actions/build-silencer-macos
        with:
          lobby-host: ${{ vars.LOBBY_HOST || 'lobby.arsiamons.com' }}
          silencer-version: ${{ env.SILENCER_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Auto-updater e2e (headless self-update)
        # Issue #303: prove the released client self-updates and the new version
        # relaunches AUTOMATICALLY. OLD = the just-built (still unsigned) release
        # bundle; NEW = a second build versioned 99999 (sccache-warm off the
        # release objects). Runs on a scratch copy, before signing, so the
        # shipped artifact stays pristine. The harness drives the real headless
        # update path and asserts `ping`==99999 on the auto-relaunched process.
        env:
          OLD_BUILD_DIR: ${{ github.workspace }}/build
        run: bash infra/scripts/test-updater.sh

      - name: Import Developer ID cert
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "$CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -P "$CERT_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k build.keychain
          security list-keychains -d user -s build.keychain \
            $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/cert.p12
          security find-identity -v -p codesigning build.keychain

      - name: Codesign with Developer ID
        working-directory: build
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          IDENTITY="Developer ID Application"
          # Sign inside-out: dylibs and helper first, then main binary, then bundle.
          # --options runtime (Hardened Runtime) + --timestamp are required
          # by notarytool.
          find Silencer.app/Contents/Frameworks -name "*.dylib" -print0 \
            | xargs -0 -n1 codesign --force --timestamp --options runtime \
              --sign "$IDENTITY"
          codesign --force --timestamp --options runtime \
            --sign "$IDENTITY" Silencer.app/Contents/Helpers/updater-stage-2
          codesign --force --timestamp --options runtime \
            --sign "$IDENTITY" Silencer.app/Contents/MacOS/Silencer
          codesign --force --timestamp --options runtime \
            --sign "$IDENTITY" Silencer.app
          codesign --verify --deep --strict --verbose=2 Silencer.app

      - name: Notarize and staple
        working-directory: build
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -ck --keepParent Silencer.app /tmp/notarize.zip
          xcrun notarytool submit /tmp/notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          rm /tmp/notarize.zip
          xcrun stapler staple Silencer.app
          xcrun stapler validate Silencer.app
          spctl -a -vv -t execute Silencer.app

      - name: Build, sign, notarize, staple DMG
        working-directory: build
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # The DMG is the user-facing download: Finder presents the
        # drag-to-/Applications affordance, and an explicit copy to
        # /Applications avoids App Translocation (which broke our
        # auto-updater's in-place rename for users running from
        # ~/Downloads). The Silencer.app inside is already stapled, so
        # both the DMG itself and its contents are notarized/stapled —
        # offline launch works either way.
        run: |
          create-dmg \
            --volname "Silencer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Silencer.app" 175 200 \
            --hide-extension "Silencer.app" \
            --app-drop-link 425 200 \
            silencer-macos-arm64.dmg \
            Silencer.app
          codesign --force --timestamp \
            --sign "Developer ID Application" \
            silencer-macos-arm64.dmg
          xcrun notarytool submit silencer-macos-arm64.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple silencer-macos-arm64.dmg
          xcrun stapler validate silencer-macos-arm64.dmg
          spctl -a -vv -t open --context context:primary-signature \
            silencer-macos-arm64.dmg

      - name: Package .app for auto-updater
        # The DMG is the install channel; the in-app updater still
        # consumes a zip (see clients/silencer/src/updater/updaterstage2.cpp
        # and services/lobby/update.go's MacOSURL field). Ship both.
        working-directory: build
        run: |
          ditto -ck --sequesterRsrc --keepParent Silencer.app silencer-macos-arm64.zip

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: build/silencer-macos-arm64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: build/silencer-macos-arm64.dmg
          if-no-files-found: error

  build-launcher-macos:
    # Same macos-15 pin as build-macos, for the same reason (the newer dyld's
    # duplicate-LC_RPATH abort). The launcher does not run the auto-updater
    # e2e — it has no self-updater yet (see docs/plans/2026-08-04-launcher-
    # self-update.md), so this job is build -> bundle -> sign -> notarize ->
    # DMG and nothing else.
    runs-on: macos-15
    timeout-minutes: 45
    needs: version
    if: needs.version.outputs.skip != 'true'
    env:
      SCCACHE_GHA_ENABLED: "true"
      SILENCER_VERSION: ${{ needs.version.outputs.protocol }}
      SILENCER_BUILD_ID: ${{ needs.version.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Install create-dmg
        # Release-only; the composite installs dylibbundler.
        run: brew install create-dmg

      - name: Build launcher
        uses: ./.github/actions/build-launcher-macos
        with:
          launcher-version: ${{ env.SILENCER_VERSION }}
          launcher-build-id: ${{ env.SILENCER_BUILD_ID }}
          build-dir: build-launcher

      - name: Import Developer ID cert
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "$CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -P "$CERT_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k build.keychain
          security list-keychains -d user -s build.keychain \
            $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/cert.p12
          security find-identity -v -p codesigning build.keychain

      - name: Codesign with Developer ID
        working-directory: build-launcher
        run: |
          IDENTITY="Developer ID Application"
          # Sign inside-out: dylibs first, then the main binary, then the
          # bundle. This MUST come after package-macos.sh's last
          # install_name_tool edit — an rpath edit invalidates a Mach-O
          # signature and Apple Silicon then SIGKILLs the binary with exit 137
          # and no output at all. --force overrides the ad-hoc signature the
          # script applied. --options runtime (Hardened Runtime) + --timestamp
          # are both required by notarytool.
          #
          # "Silencer Launcher.app" has a space: every path below is quoted,
          # and the find pipe uses -print0/-0 for the same reason.
          find "Silencer Launcher.app/Contents/Frameworks" -name "*.dylib" -print0 \
            | xargs -0 -n1 codesign --force --timestamp --options runtime \
              --sign "$IDENTITY"
          codesign --force --timestamp --options runtime \
            --sign "$IDENTITY" "Silencer Launcher.app/Contents/MacOS/Silencer Launcher"
          codesign --force --timestamp --options runtime \
            --sign "$IDENTITY" "Silencer Launcher.app"
          codesign --verify --deep --strict --verbose=2 "Silencer Launcher.app"

      - name: Notarize and staple
        working-directory: build-launcher
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -ck --keepParent "Silencer Launcher.app" /tmp/notarize-launcher.zip
          xcrun notarytool submit /tmp/notarize-launcher.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          rm /tmp/notarize-launcher.zip
          xcrun stapler staple "Silencer Launcher.app"
          xcrun stapler validate "Silencer Launcher.app"
          spctl -a -vv -t execute "Silencer Launcher.app"

      - name: Zip the stapled bundle for self-update
        working-directory: build-launcher
        # Self-update consumes a zip, not the DMG — the same shape the game's
        # updater takes, so updaterzip.cpp extracts it with ditto unchanged.
        # Zipped AFTER stapling, so a self-updated launcher carries its own
        # notarization ticket and launches offline exactly like a DMG install.
        run: |
          ditto -ck --keepParent --sequesterRsrc \
            "Silencer Launcher.app" silencer-launcher-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-macos-arm64-zip
          path: build-launcher/silencer-launcher-macos-arm64.zip
          if-no-files-found: error

      - name: Build, sign, notarize, staple DMG
        working-directory: build-launcher
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # --app-drop-link is the /Applications symlink, so the Finder window
        # shows the drag-to-install affordance. The .app inside is already
        # stapled, so the DMG and its payload each carry their own notarization
        # ticket and both launch offline.
        run: |
          create-dmg \
            --volname "Silencer Launcher" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Silencer Launcher.app" 175 200 \
            --hide-extension "Silencer Launcher.app" \
            --app-drop-link 425 200 \
            silencer-launcher-macos-arm64.dmg \
            "Silencer Launcher.app"
          codesign --force --timestamp \
            --sign "Developer ID Application" \
            silencer-launcher-macos-arm64.dmg
          xcrun notarytool submit silencer-launcher-macos-arm64.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple silencer-launcher-macos-arm64.dmg
          xcrun stapler validate silencer-launcher-macos-arm64.dmg
          spctl -a -vv -t open --context context:primary-signature \
            silencer-launcher-macos-arm64.dmg

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-macos-arm64-dmg
          path: build-launcher/silencer-launcher-macos-arm64.dmg
          if-no-files-found: error

  build-launcher-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    needs: version
    if: needs.version.outputs.skip != 'true'
    env:
      SCCACHE_GHA_ENABLED: "true"
      SILENCER_VERSION: ${{ needs.version.outputs.protocol }}
      SILENCER_BUILD_ID: ${{ needs.version.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Build launcher
        uses: ./.github/actions/build-launcher-windows
        with:
          launcher-version: ${{ env.SILENCER_VERSION }}
          launcher-build-id: ${{ env.SILENCER_BUILD_ID }}
          build-dir: build-launcher

      - name: Zip portable bundle
        shell: pwsh
        run: Compress-Archive -Path "build-launcher/package/silencer-launcher" -DestinationPath build-launcher/silencer-launcher-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-windows-x64
          path: build-launcher/silencer-launcher-windows-x64.zip
          if-no-files-found: error

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        # Not signed. Same as the game's installer — SmartScreen will warn on
        # first run, and the release notes say so.
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$env:SILENCER_VERSION" `
            clients/launcher/installer/silencer-launcher.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe failed" }
          # ISCC writes to <iss-dir>/Output by default. Hoist it so the
          # upload-artifact glob picks it up.
          Move-Item clients/launcher/installer/Output/*.exe build-launcher/

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-windows-x64-setup
          path: build-launcher/silencer-launcher-windows-x64-setup-*.exe
          if-no-files-found: error

  build-launcher-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: version
    if: needs.version.outputs.skip != 'true'
    env:
      SCCACHE_GHA_ENABLED: "true"
      SILENCER_VERSION: ${{ needs.version.outputs.protocol }}
      SILENCER_BUILD_ID: ${{ needs.version.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Build launcher
        uses: ./.github/actions/build-launcher-linux
        with:
          launcher-version: ${{ env.SILENCER_VERSION }}
          launcher-build-id: ${{ env.SILENCER_BUILD_ID }}
          build-dir: build-launcher

      - name: Package
        run: tar czf build-launcher/silencer-launcher-linux-x64.tar.gz -C build-launcher/package silencer-launcher

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-linux-x64
          path: build-launcher/silencer-launcher-linux-x64.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    needs: version
    if: needs.version.outputs.skip != 'true'
    env:
      SCCACHE_GHA_ENABLED: "true"
      SILENCER_VERSION: ${{ needs.version.outputs.protocol }}
      SILENCER_BUILD_ID: ${{ needs.version.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Build silencer
        uses: ./.github/actions/build-silencer-windows
        with:
          lobby-host: ${{ vars.LOBBY_HOST || 'lobby.arsiamons.com' }}
          silencer-version: ${{ env.SILENCER_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Auto-updater e2e (headless self-update)
        shell: pwsh
        # Issue #303 — mirror of the macOS step (see it + the design doc for the
        # rationale). OLD = the just-built release tree; NEW = a second build
        # versioned 99999. VCPKG_BINARY_SOURCES reuses the binary cache the main
        # build populated so NEW's vcpkg deps are cache hits, not source rebuilds.
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"
        run: .\infra\scripts\test-updater.ps1 -OldBuildDir "$env:GITHUB_WORKSPACE\build"

      - name: Zip portable bundle
        shell: pwsh
        run: Compress-Archive -Path "build/package/silencer" -DestinationPath build/silencer-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/silencer-windows-x64.zip
          if-no-files-found: error

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$env:SILENCER_VERSION" `
            clients/silencer/installer/silencer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe failed" }
          # ISCC writes to <iss-dir>/Output by default. Hoist into build/ so
          # the upload-artifact glob picks it up alongside the zip.
          Move-Item clients/silencer/installer/Output/*.exe build/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-setup
          path: build/silencer-windows-x64-setup-*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: version
    if: needs.version.outputs.skip != 'true'
    env:
      SCCACHE_GHA_ENABLED: "true"
      SILENCER_VERSION: ${{ needs.version.outputs.protocol }}
      SILENCER_BUILD_ID: ${{ needs.version.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Build silencer
        uses: ./.github/actions/build-silencer-linux
        with:
          lobby-host: ${{ vars.LOBBY_HOST || 'lobby.arsiamons.com' }}
          silencer-version: ${{ env.SILENCER_VERSION }}

      - name: Package
        run: tar czf build/silencer-linux-x64.tar.gz -C build/package silencer

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: build/silencer-linux-x64.tar.gz
          if-no-files-found: error

  release:
    needs:
      - version
      - build-macos
      - build-launcher-macos
      - build-windows
      - build-launcher-windows
      - build-linux
      - build-launcher-linux
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PROTOCOL: ${{ needs.version.outputs.protocol }}
      BUILD_ID: ${{ needs.version.outputs.build_id }}
      CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute release metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
            echo "name=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "name=Nightly ${BUILD_ID}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Build update manifest
        # The manifest nothing generated before this, which is why the lobby's
        # -update-manifest path and the launcher's manifest_url_* both resolved
        # to a 404 in production. Shape must match services/lobby/update.go's
        # manifestFile, plus build_id, which only the launcher reads.
        #
        # `version` stays the wire protocol number because the lobby refuses to
        # hand out update URLs unless it equals the version it is enforcing
        # (services/lobby/client.go:161). `build_id` is what distinguishes two
        # nightlies, so it is what the launcher compares.
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.meta.outputs.tag }}"
          mac_zip=artifacts/macos-arm64/silencer-macos-arm64.zip
          win_zip=artifacts/windows-x64/silencer-windows-x64.zip
          for f in "$mac_zip" "$win_zip"; do
            [[ -f "$f" ]] || { echo "missing artifact: $f" >&2; exit 1; }
          done
          jq -n \
            --arg version    "$PROTOCOL" \
            --arg build_id   "$BUILD_ID" \
            --arg channel    "$CHANNEL" \
            --arg macos_url  "$base/silencer-macos-arm64.zip" \
            --arg macos_sha  "$(sha256sum "$mac_zip" | cut -d' ' -f1)" \
            --arg win_url    "$base/silencer-windows-x64.zip" \
            --arg win_sha    "$(sha256sum "$win_zip" | cut -d' ' -f1)" \
            '{version: $version, build_id: $build_id, channel: $channel,
              macos_url: $macos_url, macos_sha256: $macos_sha,
              windows_url: $win_url, windows_sha256: $win_sha}' \
            > update.json
          cat update.json

      - name: Build launcher update manifest
        # The launcher's own manifest, served at /api/launcher/manifest/self
        # and consumed by its self-updater. Separate from update.json because
        # it describes a different payload: the launcher ships on one track,
        # so this follows stable releases only.
        #
        # macOS only for now — self-update on Windows and Linux needs the
        # stage-2 branches proven on those platforms first, and a URL here that
        # nothing can install would present the user an update that always
        # fails.
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.meta.outputs.tag }}"
          mac_zip=artifacts/launcher-macos-arm64-zip/silencer-launcher-macos-arm64.zip
          [[ -f "$mac_zip" ]] || { echo "missing artifact: $mac_zip" >&2; exit 1; }
          jq -n \
            --arg version   "$PROTOCOL" \
            --arg build_id  "$BUILD_ID" \
            --arg channel   "$CHANNEL" \
            --arg macos_url "$base/silencer-launcher-macos-arm64.zip" \
            --arg macos_sha "$(sha256sum "$mac_zip" | cut -d' ' -f1)" \
            '{version: $version, build_id: $build_id, channel: $channel,
              macos_url: $macos_url, macos_sha256: $macos_sha}' \
            > update-launcher.json
          cat update-launcher.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/macos-arm64/*
            artifacts/macos-arm64-dmg/*
            artifacts/launcher-macos-arm64-dmg/*
            artifacts/windows-x64/*
            artifacts/windows-x64-setup/*
            artifacts/launcher-windows-x64/*
            artifacts/launcher-windows-x64-setup/*
            artifacts/linux-x64/*
            artifacts/launcher-linux-x64/*
            artifacts/launcher-macos-arm64-zip/*
            update.json
            update-launcher.json
          body: |
            ## Downloads — game

            - **macOS (Apple Silicon) — DMG (recommended):** `silencer-macos-arm64.dmg` (drag to Applications)
            - **macOS (Apple Silicon) — portable zip:** `silencer-macos-arm64.zip`
            - **Windows (x64) — installer (recommended):** `silencer-windows-x64-setup-*.exe`
            - **Windows (x64) — portable zip:** `silencer-windows-x64.zip`
            - **Linux (x64):** `silencer-linux-x64.tar.gz`

            ## Downloads — launcher

            Installs and launches the game for you, and shows news and releases.

            - **macOS (Apple Silicon) — DMG:** `silencer-launcher-macos-arm64.dmg` (drag to Applications)
            - **Windows (x64) — installer:** `silencer-launcher-windows-x64-setup-*.exe`
            - **Windows (x64) — portable zip:** `silencer-launcher-windows-x64.zip`
            - **Linux (x64):** `silencer-launcher-linux-x64.tar.gz`

            ## First-run warnings

            ### Windows
            The Windows builds aren't code-signed. If SmartScreen shows *"Windows protected your PC"*, click **More info** → **Run anyway**.

            ### Linux
            The Linux builds aren't signed or sandboxed either. Extract the tarball and run the binary from inside the extracted dir — `fonts/` and `assets/` have to stay beside it.

  publish-npm:
    # Tag-only — manual workflow_dispatch on a non-tag ref skips this job
    # because the staging script needs a real semver to pin packages with.
    #
    # Gating note: `needs: [release]` means a publish failure marks the
    # whole Release workflow as failed, which gates deploy.yml's
    # workflow_run trigger. If publish-npm fails post-release-created, the
    # GitHub Release still lands but the engine deploy doesn't auto-fire —
    # rerun deploy.yml manually after fixing the npm side.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # for `npm publish --provenance` via GitHub OIDC.
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build top-level bundle
        # `bun run build` runs `bun build src/index.ts --target=bun` which
        # produces clients/tui/dist/index.js. The staging script copies
        # dist/ into the @arsia-mons/silencer package directory.
        run: |
          bun install --frozen-lockfile
          bun run --cwd clients/tui build

      - name: Stage npm packages
        # Tag scheme is a zero-padded build counter (vNNNNN), but npm
        # requires semver. Map vNNNNN → 0.0.N (decimal, no leading zeros)
        # so each release becomes a patch-level bump.
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          raw="${VERSION#v}"
          ver="0.0.$((10#$raw))"
          bun clients/tui/scripts/stage-npm-packages.ts \
            --version "$ver" \
            --artifacts ./artifacts \
            --out ./npm-staging \
            --tui-pkg ./clients/tui

      - name: Publish to npm
        # Order matters for tidiness only — optionalDependencies don't fail
        # the install if the matching one isn't published yet, but we still
        # publish bottom-up: per-platform binaries → top-level → unscoped
        # redirect. --access public is required on first publish of a
        # scoped package; idempotent thereafter.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          for pkg in silencer-darwin-arm64 silencer-linux-x64 silencer-win32-x64 silencer silencer-tui; do
            echo "=== publishing $pkg ==="
            (cd "npm-staging/$pkg" && npm publish --access public --provenance)
          done
