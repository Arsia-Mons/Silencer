# TEMPORARY diagnostic for issue #341. Delete before the PR merges.
#
# The auto-updater e2e fails on CI with curl=28 (connect timeout) against its
# own loopback HTTP server, while the same test passes locally. This workflow
# reproduces only the network part — no game build — so a full answer costs
# ~2 minutes instead of a full release run.
name: Debug loopback

on:
  workflow_dispatch:
  # `workflow_dispatch` only resolves against the default branch, so a
  # branch-only diagnostic has to trigger on its own push.
  push:
    branches: [fix/issue-341-updater-e2e-loopback]

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Probe
        # A diagnostic must run every probe, so a probe that legitimately exits
        # non-zero (a refused connection IS a result) must not abort the step.
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          echo "IMAGE_VERSION=${ImageVersion:-$IMAGE_VERSION}"
          sw_vers
          curl --version
          python3 --version
          env | grep -i proxy || echo "NO PROXY VARS"

          WORK="$(mktemp -d)"; cd "$WORK"
          head -c 1048576 /dev/urandom > payload.bin

          pick_port() { bun -e 'const s=Bun.listen({hostname:"127.0.0.1",port:0,socket:{data(){}}});console.log(s.port);s.stop();'; }

          # (A) Is a port with NO listener refused (fast) or dropped (timeout)?
          DEAD="$(pick_port)"
          echo "=== A: connect to unbound port $DEAD ==="
          time curl -sS -o /dev/null --max-time 20 "http://127.0.0.1:$DEAD/" ; echo "curl rc=$?"

          # (B) The harness's exact server: default bind (0.0.0.0), no readiness wait.
          P1="$(pick_port)"
          echo "=== B: python3 -m http.server $P1 (default bind) ==="
          ( python3 -m http.server "$P1" >server1.log 2>&1 ) &
          S1=$!
          sleep 2
          lsof -nP -iTCP -sTCP:LISTEN | grep -E "Python|python|$P1" || echo "NOTHING LISTENING"
          cat server1.log || true
          time curl -sS -o /dev/null -w 'http=%{http_code} connect=%{time_connect} total=%{time_total}\n' \
            --max-time 20 "http://127.0.0.1:$P1/payload.bin" ; echo "curl rc=$?"
          kill $S1 2>/dev/null || true

          # (C) Same server, bound explicitly to loopback.
          P2="$(pick_port)"
          echo "=== C: python3 -m http.server --bind 127.0.0.1 $P2 ==="
          ( python3 -m http.server --bind 127.0.0.1 "$P2" >server2.log 2>&1 ) &
          S2=$!
          sleep 2
          lsof -nP -iTCP -sTCP:LISTEN | grep -E "Python|python|$P2" || echo "NOTHING LISTENING"
          cat server2.log || true
          time curl -sS -o /dev/null -w 'http=%{http_code} connect=%{time_connect} total=%{time_total}\n' \
            --max-time 20 "http://127.0.0.1:$P2/payload.bin" ; echo "curl rc=$?"
          kill $S2 2>/dev/null || true

          # (D) Does bun's pick_port actually release the port it hands back?
          P3="$(pick_port)"
          echo "=== D: is picked port $P3 free right after pick_port returns? ==="
          lsof -nP -iTCP:"$P3" || echo "port $P3 is free"

          # (E) The updater's own libcurl options, compiled and run.
          echo "=== E: libcurl with the updater's exact easy options ==="
          P4="$(pick_port)"
          ( python3 -m http.server "$P4" >server3.log 2>&1 ) &
          S4=$!
          sleep 2
          cat > probe.c <<'EOF'
          #include <curl/curl.h>
          #include <stdio.h>
          static size_t wr(void *p, size_t s, size_t n, void *u) { (void)p; (void)u; return s * n; }
          int main(int argc, char **argv) {
              curl_global_init(CURL_GLOBAL_DEFAULT);
              CURL *c = curl_easy_init();
              curl_easy_setopt(c, CURLOPT_URL, argv[1]);
              curl_easy_setopt(c, CURLOPT_FOLLOWLOCATION, 1L);
              curl_easy_setopt(c, CURLOPT_MAXREDIRS, 5L);
              curl_easy_setopt(c, CURLOPT_WRITEFUNCTION, wr);
              curl_easy_setopt(c, CURLOPT_NOPROGRESS, 0L);
              curl_easy_setopt(c, CURLOPT_FAILONERROR, 1L);
              curl_easy_setopt(c, CURLOPT_CONNECTTIMEOUT, 15L);
              curl_easy_setopt(c, CURLOPT_USERAGENT, "silencer-updater/1.0");
              curl_easy_setopt(c, CURLOPT_VERBOSE, 1L);
              CURLcode rc = curl_easy_perform(c);
              long http = 0;
              curl_easy_getinfo(c, CURLINFO_RESPONSE_CODE, &http);
              printf("PROBE rc=%d http=%ld msg=%s\n", (int)rc, http, curl_easy_strerror(rc));
              return 0;
          }
          EOF
          cc -o probe probe.c -lcurl
          time ./probe "http://127.0.0.1:$P4/payload.bin"
          kill $S4 2>/dev/null || true

  windows:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "IMAGE_VERSION=$env:IMAGE_VERSION"
          curl.exe --version
          python --version
          Get-ChildItem env: | Where-Object { $_.Name -match 'proxy' } | Format-List

          $work = Join-Path $env:TEMP ("loopback-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $work | Out-Null
          Set-Location $work
          $bytes = New-Object byte[] 1048576
          [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          [IO.File]::WriteAllBytes((Join-Path $work 'payload.bin'), $bytes)

          function Pick-Port {
              $l = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
              $l.Start(); $p = $l.LocalEndpoint.Port; $l.Stop(); return $p
          }

          # (A) unbound port: refused or dropped?
          $dead = Pick-Port
          Write-Host "=== A: connect to unbound port $dead ==="
          Measure-Command { curl.exe -sS -o NUL --max-time 20 "http://127.0.0.1:$dead/" } | Select-Object TotalSeconds
          Write-Host "curl exit=$LASTEXITCODE"

          # (B) the harness's exact server
          $p1 = Pick-Port
          Write-Host "=== B: python -m http.server $p1 (default bind) ==="
          $s1 = Start-Process -PassThru -WindowStyle Hidden python -ArgumentList "-m","http.server","$p1" -WorkingDirectory $work
          Start-Sleep 3
          netstat -ano | Select-String ":$p1"
          curl.exe -sS -o NUL -w 'http=%{http_code} connect=%{time_connect} total=%{time_total}\n' --max-time 20 "http://127.0.0.1:$p1/payload.bin"
          Write-Host "curl exit=$LASTEXITCODE"
          Stop-Process -Id $s1.Id -Force -ErrorAction SilentlyContinue

          # (C) explicit loopback bind
          $p2 = Pick-Port
          Write-Host "=== C: python -m http.server --bind 127.0.0.1 $p2 ==="
          $s2 = Start-Process -PassThru -WindowStyle Hidden python -ArgumentList "-m","http.server","--bind","127.0.0.1","$p2" -WorkingDirectory $work
          Start-Sleep 3
          netstat -ano | Select-String ":$p2"
          curl.exe -sS -o NUL -w 'http=%{http_code} connect=%{time_connect} total=%{time_total}\n' --max-time 20 "http://127.0.0.1:$p2/payload.bin"
          Write-Host "curl exit=$LASTEXITCODE"
          Stop-Process -Id $s2.Id -Force -ErrorAction SilentlyContinue

          # (D) firewall state — an outbound-block or a default-deny inbound rule
          #     would drop the SYN and produce exactly the curl=28 we see.
          Write-Host "=== D: firewall profiles ==="
          Get-NetFirewallProfile | Select-Object Name, Enabled, DefaultInboundAction, DefaultOutboundAction | Format-Table
