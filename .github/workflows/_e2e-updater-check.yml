# TEMPORARY — validates the auto-updater e2e step (issue #303 / PR #304) on real
# macOS + Windows runners in isolation: build the client via the same composite
# action release.yml uses, then run the harness against it. No signing, no
# release, no npm — zero side effects. DELETE before merging the PR.
name: _e2e-updater-check

on:
  workflow_dispatch:
  push:
    branches: [hv/e2e-auto-updater-test]

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Build silencer
        uses: ./.github/actions/build-silencer-macos
        with:
          silencer-version: "00060"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Auto-updater e2e (headless self-update)
        env:
          OLD_BUILD_DIR: ${{ github.workspace }}/build
        run: bash infra/scripts/test-updater.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Build silencer
        uses: ./.github/actions/build-silencer-windows
        with:
          silencer-version: "00060"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Auto-updater e2e (headless self-update)
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"
        run: .\infra\scripts\test-updater.ps1 -OldBuildDir "$env:GITHUB_WORKSPACE\build"
