name: CI Build (launcher, Linux)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-build-launcher-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-launcher-linux:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      # See ci-build-launcher-macos.yml for why the filter is gated inside the
      # job and why clients/silencer/ subtrees are in the allowlist.
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            relevant:
              - 'clients/launcher/**'
              - 'clients/launcher-stub/**'
              - 'clients/lobby-sdk/cpp/**'
              - 'clients/silencer/src/ui/**'
              - 'clients/silencer/src/render/cppx_ui/**'
              - 'clients/silencer/src/client/ui/**'
              - 'clients/silencer/src/updater/**'
              - 'clients/silencer/src/platform/perf_trace.*'
              - 'clients/silencer/third_party/**'
              - 'clients/silencer/tools/cppx_transpile.py'
              - 'shared/fonts/**'
              - 'shared/assets/**'
              - 'tests/e2e/check-bundle-linux.sh'
              - '.github/actions/build-launcher-linux/**'
              - '.github/workflows/ci-build-launcher-linux.yml'

      - name: Build launcher
        if: steps.changes.outputs.relevant == 'true'
        uses: ./.github/actions/build-launcher-linux

      - name: Verify bundled dependencies
        if: steps.changes.outputs.relevant == 'true'
        # The payload subdir is where the .so-carrying launcher lives (stub-first
        # layout, #347); the action itself asserts the root stub's ldd is bare.
        run: tests/e2e/check-bundle-linux.sh build-launcher/package/silencer-launcher/payload silencer-launcher

      - if: steps.changes.outputs.relevant != 'true'
        run: echo "No launcher/reused-source/asset changes; skipping launcher Linux build."
