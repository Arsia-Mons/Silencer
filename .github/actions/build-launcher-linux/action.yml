name: Build Silencer Launcher (Linux)
description: Configure + build + bundle SDL3 for the Silencer launcher on Linux x64. Caller must have run actions/checkout first; tar packaging and uploads live in the caller (release-only).

inputs:
  launcher-version:
    description: SILENCER_LAUNCHER_VERSION cmake define. Linux has no version resource to stamp it into, so it only reaches the build as a define.
    default: "00000"
  build-dir:
    description: Where to configure the build. Kept out of the game's build/ so both jobs can run from one checkout.
    default: build-launcher

runs:
  using: composite
  steps:
    - name: Install build deps
      shell: bash
      # SDL3 comes from setup-sdl below (built from source); this is what
      # setup-sdl needs at configure time, plus minizip (updaterzip.cpp links
      # it off macOS), libcurl, and patchelf for the $ORIGIN rpath.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake ninja-build patchelf pkg-config python3 \
          libminizip-dev libcurl4-openssl-dev \
          libasound2-dev libpulse-dev libudev-dev libxext-dev \
          libxinerama-dev libxcursor-dev libxrandr-dev libxss-dev \
          libxi-dev libxfixes-dev libxtst-dev libwayland-dev \
          libxkbcommon-dev libdbus-1-dev libibus-1.0-dev

    - name: Install SDL3 + SDL3_ttf
      uses: libsdl-org/setup-sdl@main
      with:
        version: 3-latest
        version-sdl-ttf: 3-latest
        # Vendored freetype/harfbuzz keeps libSDL3_ttf self-contained, so there
        # is nothing extra to bundle beside the binary.
        cmake-arguments: -DSDLTTF_VENDORED=ON

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.10

    - name: Configure
      shell: bash
      env:
        LAUNCHER_VERSION_INPUT: ${{ inputs.launcher-version }}
        BUILD_DIR: ${{ inputs.build-dir }}
      run: |
        cmake -B "$BUILD_DIR" -S clients/launcher \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DSILENCER_LAUNCHER_VERSION="$LAUNCHER_VERSION_INPUT"

    - name: Build
      shell: bash
      env:
        BUILD_DIR: ${{ inputs.build-dir }}
      run: cmake --build "$BUILD_DIR" -j"$(nproc)"

    - name: sccache stats
      if: always()
      shell: bash
      run: sccache --show-stats

    - name: Bundle SDL3 + resources
      shell: bash
      env:
        BUILD_DIR: ${{ inputs.build-dir }}
      # Copy each .so dereferenced — the binary's NEEDED entry is the soname,
      # so a single regular file at that path is what the loader wants. Then
      # patchelf RPATH=$ORIGIN so the bundled SDL3 loads from the executable's
      # own dir instead of the build-time install paths, which do not exist on
      # a user's machine. fonts/ and assets/ come across as-is: those two dir
      # names beside the binary are what resolve_resource_dir() probes for.
      run: |
        echo "--- SDL3 install roots ---"
        echo "  SDL3_ROOT=$SDL3_ROOT"
        echo "  SDL3_ttf_ROOT=$SDL3_ttf_ROOT"
        stage="$BUILD_DIR/package/silencer-launcher"
        mkdir -p "$stage"
        cp "$BUILD_DIR/silencer-launcher" "$stage/"
        cp -L "$SDL3_ROOT/lib/libSDL3.so.0" "$stage/"
        cp -L "$SDL3_ttf_ROOT/lib/libSDL3_ttf.so.0" "$stage/"
        patchelf --set-rpath '$ORIGIN' "$stage/silencer-launcher"
        cp -r "$BUILD_DIR/fonts" "$stage/fonts"
        cp -r "$BUILD_DIR/assets" "$stage/assets"
        echo "--- staged files ---"
        ls -la "$stage"
        echo "--- ldd output ---"
        ldd "$stage/silencer-launcher"
        if ldd "$stage/silencer-launcher" | grep -F "not found"; then
          echo "ERROR: missing dynamic library dependencies"
          exit 1
        fi
        # The two sentinels resolve_resource_dir() probes. Missing fonts are
        # fatal at startup, so fail the build here instead of shipping it.
        for f in "$stage/fonts/silencer-135.otf" "$stage/assets/PALETTE.BIN"; do
          [ -f "$f" ] || { echo "ERROR: missing resource sentinel: $f"; exit 1; }
        done
