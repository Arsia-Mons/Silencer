name: Check Client Changes
description: >
  Detect whether a PR or push touches files relevant to the native client
  builds (Linux/macOS/Windows). Outputs relevant=true/false. Caller must
  have checked out with fetch-depth: 0.

outputs:
  relevant:
    description: 'true if changed files touch client/asset/test code'
    value: ${{ steps.check.outputs.relevant }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          base='${{ github.event.pull_request.base.sha }}'
        else
          base='${{ github.event.before }}'
        fi
        if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
          echo "relevant=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if git diff --name-only "$base" HEAD | grep -Ev \
             '^(services/|web/|infra/|docs/|designer/|shared/(design|skills)/|[^/]+\.md$|\.gitignore$|\.github/workflows/(ci-build-admin-[^/]*|ci-build-lobby-docker|deploy[^/]*|release)\.yml$)' \
             | grep -q .; then
          echo "relevant=true" >> "$GITHUB_OUTPUT"
        else
          echo "relevant=false" >> "$GITHUB_OUTPUT"
        fi
