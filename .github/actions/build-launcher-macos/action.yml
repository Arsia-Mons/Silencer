name: Build Silencer Launcher (macOS)
description: Configure + build + bundle dylibs for the Silencer launcher on macOS arm64. Caller must have run actions/checkout first; codesign / notarize / DMG live in the caller (release-only).

inputs:
  launcher-version:
    description: Version stamped into CFBundleShortVersionString / CFBundleVersion. release.yml passes the git tag with its leading v stripped.
    default: "00000"
  launcher-build-id:
    description: Build identity stamped in as SILENCER_LAUNCHER_BUILD_ID. Distinct from launcher-version, which must stay numeric for CFBundleShortVersionString; this is what self-update compares. Defaults to the version for a stable build.
    default: "00000"
  build-dir:
    description: Where to configure the build. Kept out of the game's build/ so both jobs can run from one checkout.
    default: build-launcher

runs:
  using: composite
  steps:
    - name: Install Homebrew deps
      shell: bash
      # No minizip: updaterzip.cpp shells out to ditto on macOS, so the
      # launcher never links it (see clients/launcher/CMakeLists.txt).
      run: brew install dylibbundler

    - name: Install SDL3 + SDL3_ttf
      uses: libsdl-org/setup-sdl@main
      with:
        version: 3-latest
        version-sdl-ttf: 3-latest
        # Same as the client: vendored freetype/harfbuzz keeps libSDL3_ttf
        # self-contained, so there is no system freetype to bundle alongside.
        cmake-arguments: -DSDLTTF_VENDORED=ON

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.10

    - name: Configure
      shell: bash
      env:
        LAUNCHER_VERSION_INPUT: ${{ inputs.launcher-version }}
        LAUNCHER_BUILD_ID_INPUT: ${{ inputs.launcher-build-id }}
        BUILD_DIR: ${{ inputs.build-dir }}
      run: |
        cmake -B "$BUILD_DIR" -S clients/launcher \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DSILENCER_LAUNCHER_VERSION="$LAUNCHER_VERSION_INPUT" \
          -DSILENCER_LAUNCHER_BUILD_ID="$LAUNCHER_BUILD_ID_INPUT"

    - name: Build
      shell: bash
      env:
        BUILD_DIR: ${{ inputs.build-dir }}
      run: cmake --build "$BUILD_DIR" -j"$(sysctl -n hw.ncpu)"

    - name: sccache stats
      if: always()
      shell: bash
      run: sccache --show-stats

    - name: Bundle dylibs
      shell: bash
      env:
        BUILD_DIR: ${{ inputs.build-dir }}
      # package-macos.sh owns the whole dylib story (copy into
      # Contents/Frameworks, rewrite to @rpath, dedupe LC_RPATH, re-sign last)
      # and fails if any /opt/homebrew path survives. It is the same script
      # developers run locally, so CI and a desk build cannot drift.
      # setup-sdl exports SDL3_ROOT / SDL3_ttf_ROOT, which the script reads as
      # dylibbundler search paths.
      run: bash clients/launcher/package-macos.sh "$BUILD_DIR/Silencer Launcher.app"

    - name: Build bootstrap stub
      shell: bash
      # The stub (clients/launcher-stub) is what users actually open; it has
      # no dependencies, so this is a bare CMake build producing its own
      # "Silencer Launcher.app" bundle.
      env:
        LAUNCHER_VERSION_INPUT: ${{ inputs.launcher-version }}
        BUILD_DIR: ${{ inputs.build-dir }}
      run: |
        cmake -B "$BUILD_DIR-stub" -S clients/launcher-stub \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DSILENCER_STUB_VERSION="$LAUNCHER_VERSION_INPUT"
        cmake --build "$BUILD_DIR-stub" -j"$(sysctl -n hw.ncpu)"

    - name: Compose stub-first bundle
      shell: bash
      env:
        BUILD_DIR: ${{ inputs.build-dir }}
      # Stub-first layout (issue #347): the shipped "Silencer Launcher.app"
      # IS the stub's bundle; the self-contained cppx launcher app is nested
      # at Contents/Resources/payload/ as the seed the stub launches when its
      # versioned store (Application Support) is empty. The payload app also
      # survives at $BUILD_DIR/payload-stage/ — release.yml zips THAT as the
      # self-update payload archive.
      run: |
        mkdir -p "$BUILD_DIR/payload-stage"
        mv "$BUILD_DIR/Silencer Launcher.app" "$BUILD_DIR/payload-stage/Silencer Launcher.app"
        ditto "$BUILD_DIR-stub/Silencer Launcher.app" "$BUILD_DIR/Silencer Launcher.app"
        mkdir -p "$BUILD_DIR/Silencer Launcher.app/Contents/Resources/payload"
        ditto "$BUILD_DIR/payload-stage/Silencer Launcher.app" \
              "$BUILD_DIR/Silencer Launcher.app/Contents/Resources/payload/Silencer Launcher.app"
        for p in "$BUILD_DIR/Silencer Launcher.app/Contents/MacOS/Silencer Launcher" \
                 "$BUILD_DIR/Silencer Launcher.app/Contents/Resources/payload/Silencer Launcher.app/Contents/MacOS/Silencer Launcher"; do
          [ -x "$p" ] || { echo "ERROR: missing composed sentinel: $p"; exit 1; }
        done

    - name: Show bundle
      shell: bash
      env:
        BUILD_DIR: ${{ inputs.build-dir }}
      run: |
        plutil -p "$BUILD_DIR/Silencer Launcher.app/Contents/Info.plist"
        ls "$BUILD_DIR/Silencer Launcher.app/Contents/Resources"
        ls -R "$BUILD_DIR/Silencer Launcher.app/Contents/Resources/payload/Silencer Launcher.app/Contents/Resources" | head -40
